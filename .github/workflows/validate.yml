name: validate

# PR 与 main 跑同一套检查，保证「本地过了 CI 就过」。
on:
  pull_request:
  push:
    branches: [main]

# 只读权限：校验不需要写仓库
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验数据结构与业务规则
        run: npm run validate

      - name: 检查产物是否与数据一致
        run: npm run build:check

      - name: 脚本单元测试
        run: npm test
